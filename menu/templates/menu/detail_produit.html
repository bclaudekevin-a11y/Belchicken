{% extends 'base.html' %}
{% block content %}
<div class="container my-5">
    <div class="row justify-content-center text-center">
        <div class="col-md-6">
            
            <!-- Image parfaitement centrée -->
            <div class="d-flex justify-content-center mb-4">
                <img src="{{ produit.image.url }}" class="img-fluid rounded shadow mx-auto d-block" style="max-height: 320px; width: auto;" alt="Produit">
            </div>
            
            <!-- Prix grossi -->
            <p class="text-dark fw-bold fs-3">{{ produit.prix }} FCFA</p>
            <p class="my-3 text-secondary">{{ produit.description }}</p>

            <!-- Formulaire avec bouton grossi et centré -->
            <form method="POST" action="{% url 'menu:ajouter_au_panier' produit.id %}" class="mt-4">
                {% csrf_token %}
                <input type="hidden" name="quantite" value="1">
                <button type="submit" class="btn btn-success btn-lg px-5 py-3 fs-5 fw-bold">Commander ce produit</button>
            </form>
            
        </div>
    </div>
</div>
{% endblock %}
