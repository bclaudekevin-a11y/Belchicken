{% extends 'base.html' %}
{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <!-- Image bien centrée -->
            <div class="mb-4">
                <img src="{{ produit.image.url }}" class="img-fluid rounded shadow" style="max-height: 350px; width: auto;" alt="Produit">
            </div>
            
            <!-- Prix et description centrés -->
            <p class="text-muted h4 fw-bold">{{ produit.prix }} FCFA</p>
            <p class="my-3 text-secondary">{{ produit.description }}</p>

            <!-- Formulaire de commande centré -->
            <form method="POST" action="{% url 'menu:ajouter_au_panier' produit.id %}" class="mt-4">
                {% csrf_token %}
                <input type="hidden" name="quantite" value="1">
                <button type="submit" class="btn btn-success btn-lg px-5">Commander ce produit</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
